[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amu-governance"
version = "0.1.0"
description = "Lineage-gated shared memory for multi-agent analytics: block cross-department data leakage and catch silent metric-definition conflicts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Venkata Sangaraju" },
    { name = "Sudhir Vissa" },
]
keywords = [
    "ai-agents",
    "data-governance",
    "data-lineage",
    "multi-agent-systems",
    "privacy",
    "memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sqlglot>=20.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/sangaraju1988/amu-governance"
"Bug Tracker" = "https://github.com/sangaraju1988/amu-governance/issues"
"Research paper" = "https://github.com/sangaraju1988/Lineage-Aware-Memory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
